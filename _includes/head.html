<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} · {{ site.description }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231f3864'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23f6f3ec' font-family='serif'%3E慢%3C/text%3E%3C/svg%3E">

  {% if page.excerpt %}
  <meta name="description" content="{{ page.excerpt | strip_html }}" />
  {% else %}
  <meta name="description" content="{{ site.description }}">
  {% endif %}
  <meta name="author" content="{{ site.name }}" />

  <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />

  <script src="https://cdn.jsdelivr.net/npm/gitalk@1/dist/gitalk.min.js"></script>

  <style>
    :root{
      --paper:#f6f3ec;
      --ink:#1f2733;
      --ink-2:#4a5568;
      --ink-3:#8a93a3;
      --blue:#1f3864;
      --blue-2:#2c4a80;
      --amber:#d9a441;
      --red:#c0502e;
      --line:#e2ddcf;
      --card:#fffdf6;
      --shadow:0 1px 3px rgba(31,56,100,.06);
      --shadow-lg:0 14px 34px rgba(31,56,100,.12);
      --serif:"Songti SC","Noto Serif SC",STSong,serif;
      --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
      --ease:cubic-bezier(.22,1,.36,1);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{
      background:var(--paper);color:var(--ink);
      font-family:var(--sans);font-size:16px;line-height:1.8;
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
      display:flex;flex-direction:column;min-height:100vh;
    }
    a{color:var(--blue);text-decoration:none;}
    ::selection{background:rgba(217,164,65,.28);}
    :focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:4px;}

    /* ===== 顶栏 ===== */
    .site-header{
      border-top:2px solid var(--amber);
      border-bottom:1px solid var(--line);
      background:rgba(246,243,236,.9);
      backdrop-filter:blur(8px);
      position:sticky;top:0;z-index:20;
    }
    .site-header .inner{
      max-width:980px;margin:0 auto;padding:12px 24px;
      display:flex;align-items:center;justify-content:space-between;gap:14px;
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:0;}
    .brand .logo{
      width:40px;height:40px;flex:none;position:relative;
      display:flex;align-items:center;justify-content:center;
      font-family:var(--serif);font-size:20px;font-weight:700;color:var(--blue);
      transition:transform .3s var(--ease);
    }
    .brand .logo::before{content:"";position:absolute;inset:0;border:2px solid var(--blue);border-radius:8px;}
    .brand .logo::after{content:"";position:absolute;inset:3px;border:1px solid rgba(31,56,100,.4);border-radius:5px;}
    .brand:hover .logo{transform:rotate(-4deg) scale(1.04);}
    .brand .titles{display:flex;flex-direction:column;line-height:1.3;min-width:0;}
    .brand .name{font-size:19px;font-weight:700;letter-spacing:2px;color:var(--ink);font-family:var(--serif);}
    .brand .desc{font-size:11.5px;color:var(--ink-3);letter-spacing:1.6px;font-weight:400;}
    .nav{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;}
    .nav::-webkit-scrollbar{display:none;}
    .nav a{
      position:relative;color:var(--ink-2);font-size:14.5px;padding:8px 12px;border-radius:8px;
      white-space:nowrap;transition:color .2s;
    }
    .nav a::after{
      content:"";position:absolute;left:12px;right:12px;bottom:3px;height:2px;
      background:var(--amber);border-radius:2px;transform:scaleX(0);transform-origin:left;
      transition:transform .3s var(--ease);
    }
    .nav a:hover{color:var(--blue);}
    .nav a:hover::after{transform:scaleX(1);}
    .nav a.matrix{
      background:var(--blue);color:#fff;font-weight:600;border-radius:999px;padding:8px 18px;
      margin-left:4px;box-shadow:0 2px 8px rgba(31,56,100,.22);
      transition:transform .2s var(--ease),box-shadow .2s;
    }
    .nav a.matrix::after{display:none;}
    .nav a.matrix:hover{background:var(--blue-2);color:#fff;transform:translateY(-1px);box-shadow:0 4px 14px rgba(31,56,100,.3);}
    .nav a.active{color:var(--blue);font-weight:600;}
    .nav a.active::after{transform:scaleX(1);}

    /* ===== 主体 ===== */
    .wrap{
      flex:1;width:100%;max-width:980px;margin:0 auto;padding:56px 24px 96px;
    }
    .page,.post{
      background:var(--card);border:1px solid var(--line);border-radius:16px;
      padding:44px 48px;box-shadow:var(--shadow);
      position:relative;overflow:hidden;
    }
    .page::before,.post::before{
      content:"";position:absolute;top:0;left:0;right:0;height:3px;
      background:linear-gradient(90deg,var(--amber) 0%,var(--amber) 64px,var(--line) 64px,var(--line) 100%);
    }
    .page-title,.post h1{
      font-family:var(--serif);font-size:34px;line-height:1.4;font-weight:700;
      color:var(--ink);letter-spacing:2px;margin-bottom:20px;
    }
    .post-meta,.meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-3);margin:0 0 26px;letter-spacing:.5px;}
    .post-meta .date{color:var(--amber);font-weight:700;font-variant-numeric:tabular-nums;}
    ul.tag,ul.tags{list-style:none;display:flex;gap:6px;flex-wrap:wrap;}
    ul.tag li,ul.tags li{list-style:none;}
    ul.tag a,ul.tags a{
      font-size:12px;color:var(--ink-2);border:1px solid var(--line);
      padding:2px 12px;border-radius:999px;background:var(--paper);
      transition:color .2s,border-color .2s,background .2s;
    }
    ul.tag a:hover,ul.tags a:hover{color:#fff;background:var(--blue);border-color:var(--blue);}

    /* ===== 正文排版 ===== */
    .entry{font-size:16px;color:var(--ink-2);line-height:2;}
    .entry h2,.entry h3,.entry h4{color:var(--ink);margin:34px 0 14px;line-height:1.5;letter-spacing:.5px;}
    .entry h2{font-family:var(--serif);font-size:23px;padding-left:14px;border-left:4px solid var(--amber);font-weight:700;}
    .entry h3{font-size:18px;font-weight:700;}
    .entry p{margin:0 0 18px;}
    .entry ul,.entry ol{margin:0 0 18px;padding-left:26px;}
    .entry li{margin-bottom:8px;}
    .entry li::marker{color:var(--amber);}
    .entry blockquote{
      border-left:4px solid var(--blue);background:rgba(31,56,100,.045);
      margin:0 0 18px;padding:14px 22px;color:var(--ink-2);border-radius:0 10px 10px 0;font-style:normal;
    }
    .entry blockquote p:last-child{margin-bottom:0;}
    .entry code{
      background:rgba(31,56,100,.08);color:var(--blue);padding:2px 7px;border-radius:6px;
      font-size:14px;font-family:Consolas,Menlo,monospace;
    }
    .entry pre{
      background:#1f2733;color:#e8e4da;padding:18px 22px;border-radius:14px;
      overflow-x:auto;margin:0 0 20px;font-size:14px;line-height:1.75;
      box-shadow:var(--shadow);
    }
    .entry pre code{background:transparent;color:inherit;padding:0;}
    .entry table{border-collapse:collapse;width:100%;margin:0 0 20px;font-size:15px;}
    .entry th,.entry td{border:1px solid var(--line);padding:10px 14px;text-align:left;}
    .entry th{background:rgba(31,56,100,.06);color:var(--ink);font-weight:700;letter-spacing:.5px;}
    .entry tr:nth-child(even) td{background:rgba(246,243,236,.5);}
    .entry img{max-width:100%;border-radius:12px;margin:8px 0;box-shadow:var(--shadow);}
    .entry hr{border:0;border-top:1px solid var(--line);margin:28px 0;}
    .entry a{background-image:linear-gradient(var(--amber),var(--amber));background-size:100% 1px;background-repeat:no-repeat;background-position:0 100%;}
    .entry a:hover{color:var(--blue);background-size:100% 2px;}

    /* ===== 归档 / 标签 ===== */
    ul.archive{list-style:none;margin-top:8px;}
    ul.archive li{
      list-style:none;display:flex;justify-content:space-between;align-items:center;
      padding:12px 6px;border-bottom:1px dashed var(--line);
      transition:padding-left .25s var(--ease),background .25s;
    }
    ul.archive li:hover{padding-left:14px;background:rgba(217,164,65,.06);border-radius:8px;}
    ul.archive a{font-size:16px;color:var(--ink);letter-spacing:.5px;}
    ul.archive a:hover{color:var(--blue);}
    ul.archive time,.label time,ul.tag time{color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums;}
    ul.archive h2{
      font-family:var(--serif);font-size:20px;color:var(--blue);margin:26px 0 10px;letter-spacing:2px;
      display:flex;align-items:center;gap:12px;
    }
    ul.archive h2::after{content:"";flex:1;height:1px;background:var(--line);}
    ul.label{list-style:none;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px;}
    ul.label li{list-style:none;}
    ul.label a{
      display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);
      background:var(--card);padding:6px 16px;border-radius:999px;font-size:14px;color:var(--ink-2);
      transition:transform .2s var(--ease),border-color .2s,box-shadow .2s;
    }
    ul.label a:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-2px);box-shadow:var(--shadow);}
    ul.label .count{background:var(--blue);color:#fff;font-size:12px;border-radius:999px;padding:0 9px;font-weight:600;}

    /* ===== 分页 ===== */
    .pagination{display:flex;justify-content:space-between;gap:14px;margin-top:30px;}
    .pagination a{
      display:inline-block;padding:10px 22px;border-radius:10px;font-size:14px;font-weight:600;
      border:1px solid var(--line);background:var(--card);color:var(--ink-2);
      transition:border-color .25s,color .25s,transform .2s var(--ease),box-shadow .25s;
    }
    .pagination a:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-2px);box-shadow:var(--shadow);}
    .pagination a:empty{display:none;}

    /* ===== 页脚 ===== */
    .site-footer{
      background:var(--blue);color:rgba(246,243,236,.82);
      padding:52px 24px 44px;text-align:center;position:relative;
    }
    .site-footer::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--amber);}
    .site-footer .inner{max-width:980px;margin:0 auto;}
    .site-footer .links{display:flex;justify-content:center;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
    .site-footer .links a{
      color:rgba(246,243,236,.72);font-size:14px;padding:6px 14px;border-radius:8px;letter-spacing:1px;
      transition:color .2s,background .2s;
    }
    .site-footer .links a:hover{color:#fff;background:rgba(246,243,236,.1);}
    .site-footer .copy{color:rgba(246,243,236,.55);font-size:13px;letter-spacing:1px;}
    .site-footer .stat{color:rgba(246,243,236,.55);font-size:13px;margin-top:14px;font-family:Consolas,Menlo,monospace;letter-spacing:.5px;}
    .site-footer .stat span{color:var(--amber);font-weight:600;}

    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
    .page,.post{animation:fadeUp .7s var(--ease) both;}

    /* ===== 窄屏 ===== */
    @media (max-width:680px){
      .site-header .inner{flex-wrap:wrap;padding:10px 14px;gap:8px;}
      .brand .desc{display:none;}
      .wrap{padding:32px 14px 64px;}
      .page,.post{padding:24px 20px;border-radius:14px;}
      .page-title,.post h1{font-size:26px;}
      .entry{font-size:15.5px;}
      .entry pre{padding:14px 16px;}
    }
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none!important;transition:none!important;}
      .page,.post{animation:none;}
    }
  </style>
</head>
