<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} · {{ site.description }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231f3864'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23f6f3ec' font-family='serif'%3E慢%3C/text%3E%3C/svg%3E">

  {% if page.excerpt %}
  <meta name="description" content="{{ page.excerpt | strip_html }}" />
  {% else %}
  <meta name="description" content="{{ site.description }}">
  {% endif %}
  <meta name="author" content="{{ site.name }}" />

  <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />

  <!-- gitalk 评论（文章页使用） -->
  <script src="https://cdn.jsdelivr.net/npm/gitalk@1/dist/gitalk.min.js"></script>

  <style>
    :root{
      --paper:#f6f3ec;
      --ink:#1f2733;
      --ink-2:#4a5568;
      --ink-3:#8a93a3;
      --blue:#1f3864;
      --blue-2:#2c4a80;
      --amber:#d9a441;
      --red:#c0502e;
      --line:#e2ddcf;
      --card:#fffdf6;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{
      background:var(--paper);
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
      font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;
      display:flex;flex-direction:column;min-height:100vh;
    }
    a{color:var(--blue);text-decoration:none;}
    a:hover{color:var(--red);}

    /* 顶栏 */
    .site-header{border-bottom:1px solid var(--line);background:rgba(246,243,236,.92);position:sticky;top:0;z-index:20;}
    .site-header .inner{max-width:860px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .brand{display:flex;align-items:center;gap:10px;min-width:0;}
    .brand .logo{width:38px;height:38px;flex:none;background:var(--blue);color:var(--paper);border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:"Songti SC","Noto Serif SC",serif;font-size:19px;font-weight:700;}
    .brand .name{font-size:19px;font-weight:700;letter-spacing:1px;color:var(--ink);}
    .brand .desc{display:block;font-size:12px;color:var(--ink-3);letter-spacing:.5px;font-weight:400;}
    .nav{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;}
    .nav::-webkit-scrollbar{display:none;}
    .nav a{color:var(--ink-2);font-size:15px;padding:6px 12px;border-radius:8px;white-space:nowrap;}
    .nav a:hover{color:var(--blue);background:rgba(31,56,100,.08);}
    .nav a.matrix{background:var(--blue);color:#fff;font-weight:600;}
    .nav a.matrix:hover{background:var(--blue-2);color:#fff;}

    /* 主体 */
    .wrap{flex:1;width:100%;max-width:860px;margin:0 auto;padding:32px 20px 56px;}
    .page,.post{
      background:var(--card);border:1px solid var(--line);border-radius:14px;
      padding:30px 34px;box-shadow:0 1px 4px rgba(31,56,100,.05);
    }
    .page-title,.post h1{
      font-family:"Songti SC","Noto Serif SC",serif;font-size:30px;line-height:1.4;
      color:var(--ink);letter-spacing:1px;margin-bottom:16px;padding-bottom:14px;
      border-bottom:1px solid var(--line);
    }
    .post-meta,.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-3);margin:0 0 18px;}
    .post-meta .date{color:var(--amber);font-weight:600;}
    ul.tag,ul.tags{list-style:none;display:flex;gap:6px;flex-wrap:wrap;}
    ul.tag li,ul.tags li{list-style:none;}
    ul.tag a,ul.tags a{font-size:12px;color:var(--ink-2);border:1px solid var(--line);padding:2px 10px;border-radius:999px;background:var(--paper);}
    ul.tag a:hover,ul.tags a:hover{color:var(--red);border-color:var(--red);}

    /* 正文排版 */
    .entry{font-size:16px;color:var(--ink-2);line-height:1.9;}
    .entry h2,.entry h3,.entry h4{color:var(--ink);margin:28px 0 12px;line-height:1.5;}
    .entry h2{font-size:22px;padding-left:12px;border-left:4px solid var(--amber);}
    .entry h3{font-size:18px;}
    .entry p{margin:0 0 14px;}
    .entry ul,.entry ol{margin:0 0 14px;padding-left:24px;}
    .entry li{margin-bottom:6px;}
    .entry blockquote{border-left:4px solid var(--line);background:rgba(31,56,100,.04);margin:0 0 14px;padding:10px 18px;color:var(--ink-2);border-radius:0 8px 8px 0;}
    .entry code{background:rgba(31,56,100,.07);color:var(--blue);padding:2px 7px;border-radius:6px;font-size:14px;font-family:Consolas,Menlo,monospace;}
    .entry pre{background:#1f2733;color:#e8e4da;padding:16px 18px;border-radius:12px;overflow-x:auto;margin:0 0 16px;font-size:14px;line-height:1.7;}
    .entry pre code{background:transparent;color:inherit;padding:0;}
    .entry table{border-collapse:collapse;width:100%;margin:0 0 16px;font-size:15px;}
    .entry th,.entry td{border:1px solid var(--line);padding:9px 12px;text-align:left;}
    .entry th{background:rgba(31,56,100,.06);color:var(--ink);font-weight:700;}
    .entry img{max-width:100%;border-radius:10px;margin:6px 0;}
    .entry hr{border:0;border-top:1px solid var(--line);margin:24px 0;}
    .entry a{border-bottom:1px solid var(--amber);}
    .entry a:hover{border-bottom-color:var(--red);}

    /* 归档 / 标签 */
    ul.archive{list-style:none;}
    ul.archive li{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px dashed var(--line);}
    ul.archive time,.label time,ul.tag time{color:var(--ink-3);font-size:13px;}
    ul.archive h2{margin:22px 0 8px;}
    ul.label{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;}
    ul.label li{list-style:none;}
    ul.label a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:4px 14px;border-radius:999px;font-size:14px;color:var(--ink-2);}
    ul.label a:hover{border-color:var(--blue);color:var(--blue);}
    ul.label .count{background:var(--blue);color:#fff;font-size:12px;border-radius:999px;padding:0 8px;}

    /* 分页（文章上下篇） */
    .pagination{display:flex;justify-content:space-between;gap:14px;margin-top:24px;}
    .pagination a{display:inline-block;padding:9px 18px;border-radius:9px;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);}
    .pagination a:hover{border-color:var(--blue);color:var(--blue);}

    /* 目录（可选） */
    .toc{position:fixed;left:max(16px,calc((100vw - 860px)/2 - 220px));top:96px;width:200px;max-height:70vh;overflow:auto;font-size:13px;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}

    /* 页脚 */
    .site-footer{border-top:1px solid var(--line);background:rgba(31,56,100,.03);padding:30px 20px 40px;text-align:center;}
    .site-footer .inner{max-width:860px;margin:0 auto;}
    .site-footer .links{display:flex;justify-content:center;gap:20px;margin-bottom:12px;flex-wrap:wrap;}
    .site-footer .links a{color:var(--ink-3);font-size:14px;}
    .site-footer .links a:hover{color:var(--blue);}
    .site-footer .copy{color:var(--ink-3);font-size:13px;}
    .site-footer .stat{color:var(--ink-3);font-size:13px;margin-top:8px;font-family:Consolas,Menlo,monospace;}
    .site-footer .stat span{color:var(--blue);}

    @media (max-width:640px){
      .site-header .inner{flex-wrap:wrap;padding:12px 14px;}
      .brand .desc{display:none;}
      .wrap{padding:20px 14px 40px;}
      .page,.post{padding:20px 18px;}
      .page-title,.post h1{font-size:24px;}
      .toc{position:static;width:auto;max-height:none;margin-bottom:16px;}
    }
  </style>
</head>
