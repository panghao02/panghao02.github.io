---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>

  <div class="post-meta">
    <span class="date">{{ page.date | date: "%Y-%m-%d" }}</span>
    <ul class="tag">
      {% for tag in page.tags %}
      <li><a href="{{ site.url }}{{ site.baseurl }}/tags#{{ tag }}">{{ tag }}</a></li>
      {% endfor %}
    </ul>
  </div>

  <div class="entry">
    {{ content }}
  </div>

  {% include disqus.html %}
  {% include gitalk.html %}
</article>

<div class="pagination">
  {% if page.previous.url %}
    <a href="{{ site.url }}{{ site.baseurl }}{{ page.previous.url }}">← 上一篇</a>
  {% endif %}
  {% if page.next.url %}
    <a href="{{ site.url }}{{ site.baseurl }}{{ page.next.url }}">下一篇 →</a>
  {% endif %}
</div>
