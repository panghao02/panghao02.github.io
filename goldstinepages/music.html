<style>
  .music-box {
    max-width: 720px;
    margin: 0 auto;
  }
  .player-main {
    background: var(--card, #fffdf6);
    border: 1px solid var(--line, #e2ddcf);
    border-top: 3px solid var(--amber, #d9a441);
    border-radius: 2px;
    padding: 4px;
    box-shadow: var(--shadow, 0 1px 2px rgba(31, 39, 51, .05));
  }
  .player-main iframe {
    display: block;
    border-radius: 2px;
  }
  .player-tip {
    margin: 14px 0 10px;
    font-size: 13px;
    color: var(--ink-3, #8a93a3);
    letter-spacing: .02em;
  }
  .song-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--line, #e2ddcf);
  }
  .song-list li {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--line, #e2ddcf);
    cursor: pointer;
    transition: background .2s ease, padding-left .2s ease;
    font-size: 15px;
  }
  .song-list li:hover {
    background: rgba(217, 164, 65, .08);
    padding-left: 22px;
  }
  .song-list li.active {
    background: var(--blue, #1f3864);
    color: #f6f3ec;
  }
  .song-list .no {
    font-family: var(--serif, "Songti SC", serif);
    font-style: italic;
    font-size: 13px;
    color: var(--amber, #d9a441);
    min-width: 24px;
  }
  .song-list li.active .no {
    color: #d9a441;
  }
  .song-list .song-name {
    font-family: var(--serif, "Songti SC", "Noto Serif SC", serif);
    letter-spacing: .03em;
  }
</style>

<script>
  (function () {
    var player = document.getElementById('netease_player');
    var items = document.querySelectorAll('.song-list li');
    items.forEach(function (li) {
      li.addEventListener('click', function () {
        items.forEach(function (x) { x.classList.remove('active'); });
        li.classList.add('active');
        player.src = 'https://music.163.com/outchain/player?type=' + li.dataset.type +
          '&id=' + li.dataset.id + '&auto=1&height=430';
      });
    });
  })();
</script>
