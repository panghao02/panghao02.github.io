<style>
  .stats-note {
    max-width: 760px;
    margin: 0 0 28px;
    font-size: 14px;
    line-height: 1.8;
    color: var(--ink-3, #8a93a3);
    letter-spacing: .02em;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
    margin-bottom: 36px;
  }
  .stat-card {
    grid-column: span 2;
    background: var(--card, #fffdf6);
    border: 1px solid var(--line, #e2ddcf);
    border-top: 3px solid var(--amber, #d9a441);
    border-radius: 10px;
    padding: 20px 18px;
    box-shadow: var(--shadow, 0 1px 3px rgba(31,56,100,.06));
  }
  .stat-card.big { grid-column: span 3; }
  .stat-card .num {
    font-family: var(--serif, "Songti SC", serif);
    font-size: 34px;
    font-weight: 700;
    color: var(--blue, #1f3864);
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .stat-card .label {
    margin-top: 6px;
    font-size: 13px;
    color: var(--ink-3, #8a93a3);
    letter-spacing: .05em;
  }
  .stats-h2 {
    font-family: var(--serif, "Songti SC", serif);
    font-size: 21px;
    color: var(--blue, #1f3864);
    letter-spacing: 2px;
    padding-left: 14px;
    border-left: 4px solid var(--amber, #d9a441);
    margin: 0 0 16px;
  }
  .visit-log {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--line, #e2ddcf);
  }
  .visit-log li {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 11px 6px;
    border-bottom: 1px dashed var(--line, #e2ddcf);
    font-size: 14px;
  }
  .visit-log .time {
    flex: none;
    color: var(--amber, #d9a441);
    font-family: Consolas, Menlo, monospace;
    font-size: 13px;

    color: var(--ink-2, #4a5568);

    color: var(--ink-3, #8a93a3);

    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }

</style>

<script>
  (function () {
    var KEY = 'manxun_visit_log_v1';
    var log = [];
    try { log = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}

    function fmt(d) {
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    }

    var today = fmt(new Date());
    var td = 0;
    log.forEach(function (r) { if (r.d === today) td++; });
    document.getElementById('my_today').textContent = td;
    document.getElementById('my_total').textContent = log.length;

    var ul = document.getElementById('visit_log');
    ul.innerHTML = '';
    if (!log.length) {
      ul.innerHTML = '<li class="empty">还没有记录。从这次访问开始，每次打开站点都会在本浏览器留下一条记录。</li>';
      return;
    }
    log.slice(0, 30).forEach(function (r) {
      var li = document.createElement('li');
      var t = document.createElement('span');
      t.className = 'time';
      t.textContent = r.d + ' ' + r.t;
      var p = document.createElement('span');
      p.className = 'page';
      p.textContent = (r.n || '') + '  ·  ' + r.p;
      li.appendChild(t);
      li.appendChild(p);
      ul.appendChild(li);
    });
  })();
</script>
