<div class="video-box">
  <div class="video-player">
    <video id="main_video" controls preload="metadata" playsinline>
      <source src="/videos/start.mp4" type="video/mp4">
      您的浏览器不支持 HTML5 视频播放，请更换浏览器后重试。
    </video>
  </div>

  <p class="video-tip">正在播放：<span id="now_playing">实训演示 · start.mp4</span> —— 点击下方条目切换</p>

  <ul class="video-list">
    <li class="active" data-src="/videos/start.mp4" data-name="实训演示 · start.mp4">
      <span class="no">01</span><span class="video-name">实训演示 · start.mp4</span><span class="meta">3.4 MB</span>
    </li>
    <li data-src="/videos/test.mp4" data-name="测试视频 · test.mp4">
      <span class="no">02</span><span class="video-name">测试视频 · test.mp4</span><span class="meta">77 MB · 文件较大，加载较慢</span>
    </li>
  </ul>
</div>

<style>
  .video-box {
    max-width: 720px;
    margin: 0 auto;
  }
  .video-player {
    background: var(--card, #fffdf6);
    border: 1px solid var(--line, #e2ddcf);
    border-top: 3px solid var(--amber, #d9a441);
    border-radius: 2px;
    padding: 4px;
    box-shadow: var(--shadow, 0 1px 2px rgba(31, 39, 51, .05));
  }
  .video-player video {
    display: block;
    width: 100%;
    border-radius: 2px;
    background: #14181f;
  }
  .video-tip {
    margin: 14px 0 10px;
    font-size: 13px;
    color: var(--ink-3, #8a93a3);
    letter-spacing: .02em;
  }
  .video-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--line, #e2ddcf);
  }
  .video-list li {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--line, #e2ddcf);
    cursor: pointer;
    transition: background .2s ease, padding-left .2s ease;
    font-size: 15px;
  }
  .video-list li:hover {
    background: rgba(217, 164, 65, .08);
    padding-left: 22px;
  }
  .video-list li.active {
    background: var(--blue, #1f3864);
    color: #f6f3ec;
  }
  .video-list .no {
    font-family: var(--serif, "Songti SC", serif);
    font-style: italic;
    font-size: 13px;
    color: var(--amber, #d9a441);
    min-width: 24px;
  }
  .video-list li.active .no { color: #d9a441; }
  .video-list .video-name {
    font-family: var(--serif, "Songti SC", "Noto Serif SC", serif);
    letter-spacing: .03em;
  }
  .video-list .meta {
    margin-left: auto;
    font-size: 12px;
    color: var(--ink-3, #8a93a3);
  }
  .video-list li.active .meta { color: rgba(246, 243, 236, .7); }
</style>

<script>
  (function () {
    var video = document.getElementById('main_video');
    var tip = document.getElementById('now_playing');
    var items = document.querySelectorAll('.video-list li');
    items.forEach(function (li) {
      li.addEventListener('click', function () {
        if (li.classList.contains('active')) return;
        items.forEach(function (x) { x.classList.remove('active'); });
        li.classList.add('active');
        tip.textContent = li.dataset.name;
        video.src = li.dataset.src;
        video.load();
        video.play().catch(function () {});
      });
    });
  })();
</script>
